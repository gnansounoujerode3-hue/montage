<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1">
    <title>Du brief au film — démo des skills vidéo</title>
    <script>
      window.__timelines = window.__timelines || {};
    </script>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "League Gothic";
        src: url("assets/fonts/league-gothic-latin-400-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        font-style: normal;
        font-weight: 700;
        font-display: block;
      }

      :root {
        --paper: #F4F1DE;
        --ink: #24231F;
        --coral: #A63A27;
        --muted: #685F56;
        --rule: #D9D2C3;
        --tile: #E9E4D7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        font-family: "IBM Plex Mono", monospace;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        overflow: hidden;
        padding: 84px 76px 88px;
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Mono", monospace;
      }

      .scene-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(36, 35, 31, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(36, 35, 31, 0.035) 1px, transparent 1px);
        background-size: 84px 84px;
      }

      .scene-header,
      .scene-footer {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
      }

      .scene-header {
        min-height: 62px;
        border-bottom: 2px solid var(--rule);
        padding-bottom: 23px;
      }

      .scene-footer {
        min-height: 54px;
        border-top: 2px solid var(--rule);
        padding-top: 24px;
      }

      .eyebrow,
      .counter,
      .meta-label,
      .foot-note {
        margin: 0;
        color: var(--muted);
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .counter {
        color: var(--coral);
        white-space: nowrap;
      }

      .scene-body {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding: 56px 0;
      }

      .display {
        margin: 0;
        color: var(--ink);
        font-family: "League Gothic", sans-serif;
        font-size: 172px;
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: -0.025em;
        text-transform: uppercase;
      }

      .copy {
        max-width: 820px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 36px;
        font-weight: 400;
        line-height: 1.35;
      }

      .micro {
        color: var(--muted);
        font-size: 24px;
        line-height: 1.35;
      }

      .accent {
        color: var(--coral);
      }

      .accent-bar {
        display: block;
        width: 188px;
        height: 10px;
        background: var(--coral);
        transform-origin: left center;
      }

      .ambient-dot {
        position: absolute;
        z-index: 0;
        display: block;
        border-radius: 50%;
        background: var(--coral);
        opacity: 0;
        pointer-events: none;
      }

      .progress-track {
        display: block;
        width: 100%;
        height: 8px;
        overflow: hidden;
        background: var(--rule);
      }

      .progress-fill {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--coral);
        transform-origin: left center;
      }

      .safe-mark {
        position: absolute;
        z-index: 2;
        width: 32px;
        height: 32px;
        border-color: var(--coral);
        border-style: solid;
        opacity: 0.6;
        pointer-events: none;
      }

      .safe-mark--tl {
        top: 76px;
        left: 76px;
        border-width: 3px 0 0 3px;
      }

      .safe-mark--tr {
        top: 76px;
        right: 76px;
        border-width: 3px 3px 0 0;
      }

      .safe-mark--bl {
        bottom: 76px;
        left: 76px;
        border-width: 0 0 3px 3px;
      }

      .safe-mark--br {
        right: 76px;
        bottom: 76px;
        border-width: 0 3px 3px 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-lksm" id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="20" data-fps="30">

      <div data-hf-id="hf-yeqv" id="slot-frame-03" class="clip" data-composition-id="frame-03" data-composition-src="compositions/frames/03-animer.html" data-start="7.4" data-duration="3.8" data-track-index="1"></div>
      <div data-hf-id="hf-yjni" id="slot-frame-04" class="clip" data-composition-id="frame-04" data-composition-src="compositions/frames/04-assembler.html" data-start="11.2" data-duration="4.6" data-track-index="1"></div>
      <div data-hf-id="hf-wzd4" id="slot-frame-05" class="clip" data-composition-id="frame-05" data-composition-src="compositions/frames/05-exporter.html" data-start="15.8" data-duration="4.2" data-track-index="1"></div>
    </div>
    <script>
      const mainTimeline = gsap.timeline({ paused: true });

    </script>
  </body>
</html>
